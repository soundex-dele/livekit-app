<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AV · 远程协助</title></head>
<body><main>
<header><span class="brand">AV / REMOTE ASSISTANCE</span><span id="badge">未连接</span></header>
<section class="intro"><p class="eyebrow">连接需要对方确认</p><h1>远程协助，就在浏览器里。</h1><p>输入 Windows 端显示的连接码，申请查看主屏并操作键盘和鼠标。</p></section>
<form id="connect-form"><label>连接码<input id="code" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 位临时连接码" required autocomplete="off"></label><label>你的称呼<input id="name" maxlength="40" placeholder="让对方认出你" required></label><button id="connect" type="submit">申请连接 →</button></form>
<section class="toolbar"><p id="status" role="status">连接码有效期为 5 分钟。对方同意前，不会共享画面。</p><button id="stop" class="danger" disabled>停止连接</button></section>
<section id="viewport" tabindex="0" aria-label="远程桌面"><video id="screen" autoplay playsinline muted></video><div id="placeholder">等待远程画面</div></section>
<footer><span id="input-status">连接成功后，点击画面启用键鼠操作；离开画面后暂停输入。</span><span>主屏 · 键鼠控制 · 不共享文件与剪贴板</span></footer>
</main><script type="module" src="/src/main.ts"></script></body></html>
