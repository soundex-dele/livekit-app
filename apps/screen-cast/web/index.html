<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>AV 传屏 · 接收画面</title></head>
<body>
<header class="av-topbar"><a class="av-brand" href="./"><span class="av-brand__mark">AV</span>传屏工作台</a><div id="account-slot"></div></header>
<main>
<section class="av-page-header intro"><div><p class="eyebrow">SCREEN CAST</p><h1>接收共享画面</h1><p>生成投屏码，让电脑画面出现在这里。</p></div><span class="av-badge">浏览器接收端</span></section>
<div class="workspace">
<section class="av-card connection-card" aria-label="投屏连接">
<div class="status"><span id="badge" class="av-badge" role="status" aria-live="polite">准备接收</span><span class="secure">一次一码</span></div>
<div class="code-block"><h2>接收端投屏码</h2><div id="code" aria-label="投屏码">—</div><p id="expiry"></p></div>
<p id="hint">点击接收投屏，生成一个五分钟内有效的一次性投屏码。</p>
<div class="actions"><button id="receive" class="av-button--primary">接收投屏</button><button id="stop" class="av-button--danger" disabled>停止接收</button></div>
<p id="error" class="av-alert" data-tone="error" role="alert"></p>
<details class="steps" open><summary>如何连接</summary><ol><li>在电脑上打开「局域网传屏」</li><li>设置与本页面相同的服务器地址</li><li>输入投屏码，选择屏幕并开始投屏</li></ol></details>
</section>
<section class="av-card preview-card" aria-label="接收画面"><div class="preview-heading"><div><h2>共享画面</h2><p>最高 1080p · 15 fps</p></div><button id="fullscreen" disabled>全屏观看</button></div>
<div id="viewport"><video autoplay playsinline muted aria-label="共享屏幕视频"></video><div id="placeholder"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="8" width="36" height="26" rx="4"/><path d="M24 34v7m-9 0h18M18 20l4 4 8-9"/></svg><strong>等待屏幕画面</strong><span>连接成功后，画面将在这里显示</span></div></div>
<p class="preview-note">接收期间请保持页面打开，可随时停止接收。</p></section>
</div>
<footer class="page-footer"><span>仅共享画面 · 无声音 · 无远程控制</span><span>适用于可信局域网</span></footer>
</main><script type="module" src="/src/app/main.ts"></script></body></html>
