<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网传屏 · 接收投屏</title></head>
<body><main>
<header class="topbar"><a class="brand" href="./" aria-label="局域网传屏首页"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="18" rx="3"/><path d="M16 23v5m-7 0h14"/></svg>局域网传屏</a><span class="tag">浏览器接收端</span></header>
<section class="intro"><span class="eyebrow">连接屏幕，分享此刻</span><h1>把你的屏幕，分享到这里</h1><p>在电脑发送端输入投屏码，即可开始共享画面。</p></section>
<div class="workspace">
<section class="panel" aria-label="投屏连接">
<div class="status"><span id="badge" role="status" aria-live="polite">准备接收</span><span class="secure">一次一码</span></div>
<h2>接收端投屏码</h2><div id="code" aria-label="投屏码">—</div><p id="expiry"></p>
<p id="hint">点击接收投屏，生成一个五分钟内有效的一次性投屏码。</p>
<div class="actions"><button id="receive">接收投屏</button><button id="stop" disabled>停止接收</button><button id="fullscreen" disabled>全屏观看</button></div>
<p id="error" role="alert"></p>
<div class="steps"><h3>如何连接</h3><p><span>1</span>在电脑上打开「局域网传屏」</p><p><span>2</span>设置与本页面相同的服务器地址</p><p><span>3</span>输入投屏码，选择屏幕并开始投屏</p></div>
</section>
<section class="preview-card" aria-label="接收画面"><div class="preview-heading"><h2>共享画面</h2><span>最高 1080p · 15 fps</span></div>
<div id="viewport"><video autoplay playsinline muted aria-label="共享屏幕视频"></video><div id="placeholder"><svg viewBox="0 0 160 120" aria-hidden="true"><rect x="20" y="15" width="120" height="76" rx="8"/><path d="M80 91v18m-28 0h56"/><path class="signal" d="M62 50l14 14 25-28"/></svg><strong>等待屏幕画面</strong><span>连接成功后，画面将在这里显示</span></div></div>
<p class="preview-note">请保持页面打开，接收期间可切换至全屏观看。</p></section>
</div>
<footer>仅共享画面 · 无声音 · 无远程控制<span>适用于可信局域网</span></footer>
</main><script type="module" src="/src/app/main.ts"></script></body></html>
