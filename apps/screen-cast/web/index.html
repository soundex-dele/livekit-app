<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网传屏</title></head><body><main><header><span class="eyebrow">SCREEN CAST · 局域网传屏</span><h1>把屏幕分享至这里</h1><p>在 Windows 发送端输入投屏码，即可开始共享画面。</p></header><section class="panel"><div class="status"><span id="badge" role="status" aria-live="polite">未开始</span><span id="expiry"></span></div><div id="code" aria-label="投屏码">—</div><p id="hint">点击接收投屏，生成一个五分钟内有效的一次性投屏码。</p><div class="actions"><button id="receive">接收投屏</button><button id="stop" disabled>停止</button><button id="fullscreen" disabled>全屏</button></div><p id="error" role="alert"></p></section><section id="viewport"><video autoplay playsinline muted></video><span id="placeholder">等待屏幕画面</span></section><footer>仅共享画面 · 无声音 · 无远程控制</footer></main><script type="module" src="/src/app/main.ts"></script></body></html>
